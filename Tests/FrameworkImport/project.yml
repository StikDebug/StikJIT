name: FrameworkImport
options:
  bundleIdPrefix: com.stik
  deploymentTarget:
    iOS: "17.4"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
targets:
  FrameworkImport:
    type: application
    platform: iOS
    sources:
      - App.swift
    dependencies:
      - framework: ../../StikJIT.xcframework
        embed: true
schemes:
  FrameworkImport:
    build:
      targets:
        FrameworkImport: all
